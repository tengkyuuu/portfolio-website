name: Verify production release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-production
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Vercel's Git integration builds and promotes main automatically.
      # This independent check fails if the custom domain stays on old code.
      - run: node scripts/verify-production.mjs
        env:
          SITE_URL: https://www.jamescalunsag.online
